<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Answer Key | Averoxa Foundation</title>
<style>
:root{ --ink:#111; --muted:#555; --line:#222; }
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#e9e9e9}
body{font-family:Georgia,"Times New Roman",serif;color:var(--ink);font-size:14px;line-height:1.55}
.toolbar{position:sticky;top:0;z-index:5;background:#1c1c1c;color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;font-family:Arial,sans-serif;flex-wrap:wrap}
.toolbar button{background:#d9a53e;color:#171206;border:0;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px}
.toolbar .note{font-size:12.5px;color:#ccc}
.sheet{max-width:800px;margin:22px auto;background:#fff;padding:46px 52px;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.hd{text-align:center;border-bottom:3px double var(--ink);padding-bottom:14px;margin-bottom:16px}
.hd .org{font-size:26px;font-weight:700;letter-spacing:.04em}
.hd .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.titleblock{text-align:center;margin:18px 0}
.titleblock h1{font-size:19px;margin:0 0 4px}
.a{margin:0 0 16px;break-inside:avoid;border-bottom:1px solid #ddd;padding-bottom:12px}
.a .qn{font-weight:700}
.a .ans{color:#1a6b2f;font-weight:700;margin:4px 0}
.a .sol{font-size:13px;color:#333;margin-top:4px}
.a .rb{font-size:12.5px;color:var(--muted);margin-top:4px}
.a .rb div{margin:2px 0}
.note-grow{font-size:11.5px;color:var(--muted);text-align:center;margin:28px 0 0}
#err{max-width:700px;margin:60px auto;background:#fff;padding:30px;font-family:Arial,sans-serif;text-align:center}
@media print{
  html,body{background:#fff}
  .toolbar{display:none}
  .sheet{box-shadow:none;margin:0;padding:0;max-width:none}
}
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()">🖨 Print / Save as PDF</button>
  <span class="note">This answer key matches the exact paper your QR code came from.</span>
</div>

<div id="err" style="display:none"><h2>Question bank not found</h2><p></p></div>
<div id="sheet" class="sheet"></div>

<script src="questions.js"></script>
<script>
const EXAM_NAME = {jm:'JEE Main',ja:'JEE Advanced',neet:'NEET UG',cbse:'CBSE Class 12',isc:'ISC Class 12'};
const ALPHA_EXAMS = ['ja','cbse','isc'];
const SUBM = {vsa:2, sa:3, case:4, la:5, la4:4, la6:6, la10:10};
const SUBT = Object.keys(SUBM);
function isSub(q){ return SUBT.indexOf(q.t)>=0; }
function optLetter(ex,k){ return ALPHA_EXAMS.indexOf(ex)>=0 ? '('+'ABCD'[k]+')' : '('+(k+1)+')'; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const qs = new URLSearchParams(location.search);
const ex = qs.get('ex'), idStr = qs.get('q')||'';
const QB = (typeof QBANK!=='undefined' && Array.isArray(QBANK)) ? QBANK : null;

function fail(msg){ document.getElementById('sheet').style.display='none'; const e=document.getElementById('err'); e.style.display='block'; e.querySelector('p').textContent = msg; }

if(!QB){ fail('questions.js was not found next to this page. Upload it in the same folder as papers.html, then reload.'); }
else if(!ex || !EXAM_NAME[ex] || !idStr){ fail('This link is missing information needed to show the answer key.'); }
else {
  const ids = idStr.split('.').map(s=>parseInt(s,36));
  const list = ids.map(i=>QB[i]).filter(Boolean);
  if(list.length !== ids.length){ fail('Some questions referenced by this link could not be found — the question bank may have changed since this paper was generated.'); }
  else render(list);
}

function render(list){
  const subjects = [...new Set(list.map(q=>q.s))];
  const title = subjects.length===1 ? (EXAM_NAME[ex]+' — '+subjects[0]) : EXAM_NAME[ex];
  let html = `
  <div class="hd">
    <div class="org">AVEROXA FOUNDATION</div>
    <div class="sub">contact.averoxa@gmail.com &nbsp;·&nbsp; Answer Key</div>
  </div>
  <div class="titleblock">
    <h1>${esc(title)} — Answer Key &amp; Solutions</h1>
  </div>`;

  list.forEach((q,i)=>{
    html += `<div class="a"><div class="qn">Q${i+1}.</div>`;
    if(isSub(q)){
      html += `<div class="ans">Model answer (out of ${q.m} marks):</div><div class="sol">${q.x}</div>`;
      if(q.rb && q.rb.length){ html += '<div class="rb"><b>Marking scheme:</b>' + q.rb.map(r=>`<div>&middot; ${esc(r[0])} (${r[1]})</div>`).join('') + '</div>'; }
    } else {
      if(q.t==='mcq') html += `<div class="ans">Correct answer: ${optLetter(ex,q.a)} ${esc(q.o[q.a])}</div>`;
      else if(q.t==='multi') html += `<div class="ans">Correct answer(s): ${q.a.map(k=>optLetter(ex,k)).join(', ')}</div>`;
      else if(q.t==='num') html += `<div class="ans">Correct answer: ${q.a}</div>`;
      if(q.x) html += `<div class="sol">${q.x}</div>`;
    }
    html += '</div>';
  });

  html += `<div class="note-grow">Averoxa Foundation &middot; independent practice material, not an official answer key.</div>`;
  document.getElementById('sheet').innerHTML = html;
}
</script>
</body>
</html>
